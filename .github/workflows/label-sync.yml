name: label sync

on:
  push:
    branches:
      - main
    paths:
      - .github/ISSUE_TEMPLATE/**
      - .github/scripts/sync-labels.js
      - .github/workflows/issue-triage.yml
      - .github/workflows/label-sync.yml
      - .github/workflows/release-labels.yml
      - .github/workflows/stale.yml
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: label-sync-${{ github.ref }}

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        with:
          #language=javascript
          script: |
            const syncLabels = require('./.github/scripts/sync-labels');
            await syncLabels({ github, context });
