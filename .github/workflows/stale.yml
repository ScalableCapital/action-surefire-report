name: stale

on:
  schedule:
    - cron: '0 8 * * 1-5'
      timezone: 'Europe/Berlin'
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: stale-${{ github.ref }}

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Stale policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          enable-statistics: true
          operations-per-run: 20
          days-before-issue-stale: 90
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-all-issue-milestones: true
          exempt-all-pr-milestones: true
          exempt-all-issue-assignees: true
          exempt-all-pr-assignees: true
          exempt-draft-pr: true
          exempt-issue-labels: blocked, keep-open, release-blocker, security
          exempt-pr-labels: blocked, keep-open, release-blocker, security
          remove-issue-stale-when-updated: true
          remove-pr-stale-when-updated: true
          stale-issue-message: >
            This issue has been marked stale after 90 days without activity. Comment with an update,
            remove the `stale` label, or add `keep-open` if it should stay out of stale handling.
          close-issue-message: >
            This issue was closed after an additional 14 days without activity. Comment if it should be
            reopened and a maintainer can restore it.
          stale-pr-message: >
            This pull request has been marked stale after 30 days without activity. Push updates,
            comment with the next step, or add `keep-open` if it should remain open without activity.
          close-pr-message: >
            This pull request was closed after an additional 7 days without activity. Reopen it when
            work resumes or open a new pull request if that is simpler.
